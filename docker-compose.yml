# Local test of the full stack: web (nginx) serves the SPA and proxies /api to the api container.
#   docker compose up --build   ->  http://localhost:8080
services:
  api:
    build:
      context: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5292:8080"

  web:
    build:
      context: ./web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8080:8080"
    depends_on:
      - api
